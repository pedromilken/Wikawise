<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wikawise · HSK 3.0</title>
<meta name="description" content="Treino adaptativo para o HSK 3.0 com vocabulário, caracteres e gramática do programa oficial, cinco habilidades (听说读写译) e knowledge tracing. Derivado do DevWise.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>汉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F4; --surface:#FFFFFF; --ink:#1F2623; --graphite:#5E6863; --mist:#DDE2DD;
  --cinnabar:#B8322A; --cinnabar-soft:rgba(184,50,42,.28); --jade:#2E6B57; --jade-soft:#E3EFE9; --wrong-soft:#F7E4E2; --gold:#A7741B;
  --hanzi:"Noto Serif SC","Songti SC","SimSun","PingFang SC","Microsoft YaHei",serif;
  --ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141917;--surface:#1D2420;--ink:#E8ECE8;--graphite:#9AA59F;--mist:#2E3833;--cinnabar:#E0584C;--cinnabar-soft:rgba(224,88,76,.32);--jade:#5FAF93;--jade-soft:#1E3129;--wrong-soft:#3A2220;--gold:#D9A441;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141917;--surface:#1D2420;--ink:#E8ECE8;--graphite:#9AA59F;--mist:#2E3833;--cinnabar:#E0584C;--cinnabar-soft:rgba(224,88,76,.32);--jade:#5FAF93;--jade-soft:#1E3129;--wrong-soft:#3A2220;--gold:#D9A441;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.55;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:6px}
.wrap{min-height:100%}
[hidden]{display:none!important}
main{max-width:920px;margin:0 auto;padding:24px 20px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.2}
h1{font-size:clamp(40px,8vw,68px);margin:.2em 0 .1em;font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;margin:18px 0 10px}
h3{font-size:20px;margin:26px 0 8px}
h4{margin:18px 0 6px}
p{margin:.4em 0 .8em;text-align:justify;hyphens:auto}
a{color:var(--jade)}
.hz,.hz-ui{font-family:var(--hanzi);font-weight:400}
.hz.dim{color:var(--graphite);font-size:.85em}
.py{font-style:italic;color:var(--graphite)}
body.nopy .py.pyo{display:none}
.muted{color:var(--graphite)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between} .row.end{justify-content:flex-end;margin-top:14px} .row.center{justify-content:center}
.tag{font-size:13px;border:1px solid var(--mist);border-radius:999px;padding:2px 10px;margin-left:8px;color:var(--graphite)}
.tag.plain{background:transparent}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--mist)}
.btn.small{padding:7px 12px;font-size:15px}
.btn.danger{background:var(--cinnabar);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--jade);cursor:pointer;padding:0;text-decoration:underline}
.note{padding:12px 16px;border-left:4px solid var(--cinnabar);background:var(--surface)}

/* topo */
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--mist)}
.bar{max-width:920px;margin:0 auto;padding:10px 20px 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;margin-right:auto;padding:0}
.brand b{font-family:var(--display);font-size:20px;font-weight:800}
.logo{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--cinnabar);color:var(--cinnabar);font-size:24px;line-height:1}
.hud{display:flex;gap:14px;font-size:15px;color:var(--graphite)}
nav.tabs{max-width:920px;margin:0 auto;padding:0 12px;display:flex;overflow-x:auto;gap:2px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 11px;cursor:pointer;color:var(--graphite);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--cinnabar);font-weight:700}

/* a grade tianzige (田字格), a mesma das pautas de caligrafia */
.tzg{position:relative;display:grid;place-items:center;border:2px solid var(--cinnabar);background:var(--surface);aspect-ratio:1;width:92px}
.tzg::before,.tzg::after{content:"";position:absolute;inset:0;pointer-events:none}
.tzg::before{background:linear-gradient(to right,transparent calc(50% - .5px),var(--cinnabar-soft) calc(50% - .5px),var(--cinnabar-soft) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),var(--cinnabar-soft) calc(50% - .5px),var(--cinnabar-soft) calc(50% + .5px),transparent calc(50% + .5px))}
.tzg::after{background:linear-gradient(45deg,transparent calc(50% - .5px),var(--cinnabar-soft) calc(50% - .5px),var(--cinnabar-soft) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--cinnabar-soft) calc(50% - .5px),var(--cinnabar-soft) calc(50% + .5px),transparent calc(50% + .5px))}
.tzg .hz{position:relative;z-index:1;font-size:60px;line-height:1}
.tzg.big{width:244px}
.tzg.big svg{position:relative;z-index:1}
.tzg-row{display:flex;justify-content:center;flex-wrap:wrap}
.tzg-row .tzg+.tzg{border-left-width:0}

/* início */
.hero{padding:10px 0 8px}
.hero-grid{display:flex;margin-bottom:8px}
.hero-grid .tzg{width:min(64px,14vw)}
.hero-grid .tzg+.tzg{border-left-width:0}
.hero-grid .tzg .hz{font-size:min(40px,9vw)}
.lead{font-size:21px;max-width:40em}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:28px 0}
.pillars article{border-top:3px solid var(--ink);padding-top:10px}
.pillars h3{margin:4px 0 6px;font-size:18px}
.pillars p{font-size:15px;text-align:left}
.levels-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 20px}
.lvl{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--surface);border:1px solid var(--mist);border-radius:10px;padding:12px;cursor:pointer;text-align:left}
.lvl b{font-family:var(--display);font-size:20px}

/* mapa */
.level{margin:8px 0 30px}
.level.closed .units{opacity:.55}
.level-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;border-bottom:1px solid var(--mist);padding-bottom:6px;margin-bottom:12px}
.level-h h2{margin:0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:1px solid var(--mist);border-radius:10px;background:var(--surface);cursor:pointer}
.unit .n{font-family:var(--display);font-weight:800;font-size:18px}
.unit .pc{font-size:12px;color:var(--graphite)}
.unit .ring{width:34px;height:6px;border-radius:3px;background:linear-gradient(to right,var(--jade) calc(var(--p)*1%),var(--mist) 0)}
.unit.locked{background:transparent;color:var(--graphite)}
.unit.ok{border-color:var(--jade)} .unit.master{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.unit.gram{border-style:dashed} .unit.gram .n{font-family:var(--hanzi);color:var(--cinnabar)}

/* curso */
.course-list{display:grid;gap:8px}
.lesson{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--mist);border-radius:10px;padding:10px 14px;cursor:pointer}
.lesson .ln{font-family:var(--display);font-weight:800;font-size:22px;color:var(--cinnabar);text-align:center}

/* página de habilidade */
.meter{min-width:180px;font-size:14px;color:var(--graphite)}
.track{height:8px;border-radius:4px;background:var(--mist);overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--jade);transition:width .5s ease}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--mist);margin:8px 0 18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--graphite);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--jade);font-weight:700}
.rule{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--mist);align-items:center}
.rule .ex .hz{display:block;font-size:24px;line-height:1.4}
.rule .ex span{display:block}
.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--mist);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.say:disabled{opacity:.35;cursor:not-allowed}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
table.words td{padding:8px 10px;border-bottom:1px solid var(--mist);vertical-align:middle}
.hzbtn{background:none;border:0;font-size:24px;cursor:pointer;padding:0}
td.cls{font-size:13px;color:var(--graphite)}
.links li{margin:6px 0}
.official{columns:2 280px;column-gap:28px;padding-left:18px}
.official li{break-inside:avoid;margin:3px 0;font-size:15px}

/* exercício */
.q{background:var(--surface);border:1px solid var(--mist);border-radius:14px;padding:22px}
.q .kind{font-size:14px;color:var(--graphite);margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap}
.q .kind .tag{margin-left:8px}
.prompt{margin-bottom:16px;font-size:20px}
.prompt.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.prompt .hz{font-size:28px}
.big-gloss{font-size:26px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:1px solid var(--mist);background:var(--paper);border-radius:10px;padding:12px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .hz{font-size:24px}
.opt small{font-size:13px}
.opt.ok{background:var(--jade-soft);border-color:var(--jade)}
.opt.no{background:var(--wrong-soft);border-color:var(--cinnabar)}
.opt:disabled{cursor:default}
.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:10px}
.feedback.show{display:block} .feedback.ok{background:var(--jade-soft)} .feedback.no{background:var(--wrong-soft)}
.feedback .full{margin-top:6px} .feedback .hz.full{font-size:22px}
.xpd{font-weight:700;color:var(--gold);margin-left:6px}
.slot{min-height:64px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:14px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1px solid var(--mist);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:22px}
.ctx{margin-bottom:12px}
.dlg{margin:0;padding:0;list-style:none}
.dlg li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--mist);align-items:center}
.sp{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--ink)}
.sp.B{border-color:var(--cinnabar);color:var(--cinnabar)}
.dlg .hz{font-size:21px;line-height:1.5}
.tutor{margin-top:18px;border:1px solid var(--mist);border-radius:12px;padding:10px 14px;background:var(--surface)}
.tutor summary{cursor:pointer;font-weight:700}
.tutor textarea{width:100%;margin-top:8px;border:1px solid var(--mist);border-radius:8px;padding:8px;background:var(--paper)}
.chat{display:grid;gap:8px;margin-top:10px}
.msg{padding:8px 12px;border-radius:10px;white-space:pre-wrap}
.msg.user{background:var(--paper);justify-self:end;max-width:85%}
.msg.assistant{background:var(--jade-soft);max-width:95%}
dialog.strokes{border:1px solid var(--mist);border-radius:14px;background:var(--surface);color:var(--ink);padding:16px}
dialog.strokes .hz{font-size:24px}

/* relatório, loja, ajustes */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 18px}
.stats div{color:var(--graphite);font-size:14px}
.stats b{display:block;font-size:30px;color:var(--ink);font-family:var(--display)}
table.grid th,table.grid td{padding:7px 10px;border-bottom:1px solid var(--mist);text-align:left;font-size:15px}
table.grid th{font-size:13px;color:var(--graphite);font-weight:700}
tr.locked td{color:var(--graphite)}
.cellbar{display:inline-block;padding:2px 6px;border-radius:4px;background:linear-gradient(to right,var(--jade-soft) calc(var(--p)*1%),transparent 0)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.shop article{background:var(--surface);border:1px solid var(--mist);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.shop .ic{font-size:30px}
.field{display:grid;gap:4px;margin:10px 0;max-width:460px}
.field input,.field select{border:1px solid var(--mist);border-radius:8px;padding:8px 10px;background:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;max-width:620px}
hr{border:0;border-top:1px solid var(--mist);margin:24px 0}

@media (max-width:640px){
  body{font-size:16px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--mist);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
  nav.tabs button{border-bottom:0;border-top:3px solid transparent;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center}
  nav.tabs button[aria-current="page"]{border-top-color:var(--cinnabar)}
  .opts{grid-template-columns:1fr}
  .q{padding:16px}
  .hud{gap:10px;font-size:14px}
}
@media print{
  header.top,.noprint,.tutor{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.unit.locked .ring{visibility:hidden}
.rule p,.muted,.small{text-align:left}
.gramcard{margin:8px 0;width:100%}
.gramcard.locked{opacity:.75}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:10px}
.hzcell{border:1px solid var(--mist);background:var(--surface);border-radius:8px;font-size:24px;padding:6px 0;cursor:pointer}
.hzcell.w{border-color:var(--cinnabar);color:var(--cinnabar)}
.modhead{background:var(--surface);border:1px solid var(--mist);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.gramcard .ln{font-family:var(--display)}

</style>
</head>

ù fàndiàn.","pt":"Vou ao restaurante com um amigo.","aula":2},{"t":"Classificadores","e":"个, 本, 口, 块, 件, 只, 杯 entre número e substantivo; 两 antes de classificador.","zh":"我有两本书。","py":"wǒ yǒu liǎng běn shū.","pt":"Tenho dois livros.","aula":5},{"t":"Datas e horas","e":"Ano → mês → dia → semana; 点/分, 半.","zh":"今天是五月一号。","py":"jīntiān shì wǔ yuè yī hào.","pt":"Hoje é 1º de maio.","aula":7},{"t":"了 de conclusão e de mudança","e":"Verbo + 了 = concluído; frase + 了 = mudou.","zh":"我买了一个手机。","py":"wǒ mǎi le yí gè shǒujī.","pt":"Comprei um celular.","aula":9},{"t":"Verbos consecutivos (连动句)","e":"Um verbo indica o modo ou o objetivo do outro.","zh":"我坐地铁去公司。","py":"wǒ zuò dì tiě qù gōngsī.","pt":"Vou de metrô para a empresa.","aula":3},{"t":"Dois objetos (双宾语)","e":"Verbo + pessoa + coisa.","zh":"老师给我一本书。","py":"lǎoshī gěi wǒ yī běn shū.","pt":"O professor me deu um livro.","aula":0},{"t":"Ordinal com 第","e":"第 + número.","zh":"这是我第一次来中国。","py":"zhè shì wǒ dì yī cì lái Zhōngguó.","pt":"É minha primeira vez na China.","aula":0}],"2":[{"t":"Verbo + 过","e":"Experiência: já fez alguma vez.","zh":"我去过北京。","py":"wǒ qù guo běi jīng.","pt":"Já fui a Pequim.","aula":13},{"t":"Verbo + 着","e":"Estado ou ação que continua.","zh":"门开着。","py":"mén kāi zhe.","pt":"A porta está aberta.","aula":13},{"t":"Comparação com 比 e 没有","e":"A 比 B + adj.; A 没有 B + adj.","zh":"他比我高。","py":"tā bǐ wǒ gāo.","pt":"Ele é mais alto que eu.","aula":13},{"t":"Complemento de grau com 得","e":"Verbo + 得 + adjetivo.","zh":"她跑得很快。","py":"tā pǎo de hěn kuài.","pt":"Ela corre rápido.","aula":13},{"t":"Complemento de resultado","e":"Verbo + 完/懂/好/错/会.","zh":"我听懂了。","py":"wǒ tīng dǒng le.","pt":"Entendi (ouvindo).","aula":13},{"t":"Complemento de direção","e":"Verbo + 来/去; 上/下/进/出/回/过 + 来/去.","zh":"他走进来了。","py":"tā zǒu jìn lái le.","pt":"Ele entrou (vindo para cá).","aula":2},{"t":"还是 em perguntas e 还是…吧","e":"Ou (escolha); é melhor…","zh":"你喝茶还是喝咖啡？","py":"nǐ hē chá háishi hē kā fēi?","pt":"Você bebe chá ou café?","aula":13},{"t":"要/快要/就要…了","e":"Algo está para acontecer.","zh":"快要下雨了。","py":"kuàiyào xià yǔ le.","pt":"Vai chover logo.","aula":13},{"t":"已经…了, 正, 常/经常","e":"Já; exatamente agora; frequentemente.","zh":"我已经吃饭了。","py":"wǒ yǐjīng chī fàn le.","pt":"Já comi.","aula":13},{"t":"别 (imperativo negativo)","e":"Não faça!","zh":"别说话！","py":"bié shuōhuà!","pt":"Não fale!","aula":9},{"t":"因为…所以…, 虽然…但是…","e":"Causa e consequência; concessão.","zh":"虽然很累，但是我很高兴。","py":"suīrán hěn lèi, dànshì wǒ hěn gāoxìng.","pt":"Embora cansado, estou feliz.","aula":8},{"t":"一…就…","e":"Assim que… logo…","zh":"我一到家就睡觉了。","py":"wǒ yī dào jiā jiù shuìjiào le.","pt":"Assim que cheguei em casa, dormi.","aula":0},{"t":"是…的","e":"Enfatiza quando, onde, como ou quem, no passado.","zh":"你是怎么来的？","py":"nǐ shì zěnme lái de?","pt":"Como foi que você veio?","aula":12},{"t":"请/叫/让 + pessoa + verbo (兼语句)","e":"Convidar, mandar ou deixar alguém fazer.","zh":"妈妈让我回家。","py":"māma ràng wǒ huí jiā.","pt":"Mamãe me mandou voltar para casa.","aula":12},{"t":"从, 往, 给, 跟","e":"Desde/de; em direção a; para; com.","zh":"从这儿往前走。","py":"cóng zhèr wǎng qián zǒu.","pt":"Daqui, siga em frente.","aula":11},{"t":"Reduplicação de verbos e adjetivos","e":"AA, A一A, ABAB: fazer um pouco; AABB: intensifica.","zh":"你看看。","py":"nǐ kàn kàn.","pt":"Dê uma olhada.","aula":5},{"t":"次 e números aproximados","e":"Verbo + número + 次; 几, 多 para quantidade aproximada.","zh":"我去过两次。","py":"wǒ qù guo liǎng cì.","pt":"Fui duas vezes.","aula":13}],"3":[{"t":"Prefixo 老— e sufixos —家、—子、—员","e":"老 antes do sobrenome é um apelido familiar (老张、小李). Já 家、子、员 são sufixos que formam palavras: 作家 (quem vive de uma atividade), 桌子 (nominaliza), 演员 (pessoa de um cargo/grupo).","zh":"他姓张,我们都叫他老张。","py":"tā xìng zhāng , wǒmen dōu jiào tā lǎo zhāng.","pt":"Ele tem sobrenome Zhang e todos o chamamos de Lao Zhang.","aula":0},{"t":"Substantivos de direção e posição (方位名词)","e":"东、南、西、北 dão pontos cardeais e, com -方/-边, viram 'região/lado': 南方 (o Sul), 东方 (o Oriente). 中间 é 'o meio'.","zh":"中国的南方冬天不太冷。","py":"Zhōngguó de nánfāng dōngtiān bù tài lěng.","pt":"No sul da China o inverno não é muito frio.","aula":0},{"t":"Verbos modais (能愿动词): 需要、该、应该、愿意、得","e":"Vêm antes do verbo principal para dar necessidade, conveniência ou vontade. 得 (děi) é obrigação concreta ('ter de'); 愿意 é disposição ('ter vontade de').","zh":"这件事我得自己去做。","py":"zhè jiàn shì wǒ de zìjǐ qù zuò.","pt":"Isso eu tenho de ir fazer eu mesmo.","aula":0},{"t":"Verbos separáveis objeto+verbo (动宾式离合词): 放假、见面、结婚、洗澡","e":"Essas palavras já trazem um objeto embutido, então não aceitam outro objeto direto depois. Duração, 了 e medidores entram no meio: 结了婚、见个面、洗个澡。","zh":"我们明天见个面吧。","py":"wǒmen míngtiān jiàn gè miàn ba.","pt":"Vamos nos encontrar amanhã.","aula":0},{"t":"Verbos separáveis resultado+verbo (动补式离合词): 离开、完成、分开","e":"A separação não é livre: só acontece quando entra 得 ou 不 no meio, formando a possibilidade (V+得/不+C): 离不开 (não conseguir largar), 完得成 (conseguir terminar), 分不开 (indissociável). Fora dessa moldura, 离开/完成/分开 ficam colados.","zh":"他们明年就要分开了。","py":"tāmen míngnián jiù yào fēnkāi le.","pt":"No ano que vem, eles vão ter de se separar.","aula":0},{"t":"Uso não-interrogativo dos pronomes interrogativos (疑问代词)","e":"Fora da pergunta, 什么/谁/哪儿 com 都 significam 'tudo/todo mundo/qualquer lugar' (任指); com negação, viram 'nada/ninguém/em lugar nenhum'. Também dão sentido vago.","zh":"他什么都会说。","py":"tā shénme dōu huì shuō.","pt":"Ele fala de qualquer coisa.","aula":0},{"t":"Pronomes pessoais: 咱们、别人","e":"咱们 inclui quem fala e quem ouve ('a gente/nós dois'); 我们 pode deixar o ouvinte de fora. 别人 é 'os outros / outra pessoa'.","zh":"走,咱们回家吧。","py":"zǒu , zánmen huí jiā ba.","pt":"Vamos, a gente volta pra casa.","aula":0},{"t":"Pronomes demonstrativos: 别的、其他","e":"别的 e 其他 querem dizer 'outros/demais'. 别的 pode funcionar como pronome sozinho; 其他 costuma acompanhar o substantivo (其他资料).","zh":"这些书你先看,别的以后再看。","py":"zhèxiē shū nǐ xiān kān , biéde yǐhòu zài kān.","pt":"Você lê estes livros primeiro e os outros depois.","aula":0},{"t":"Medidores nominais específicos (专用名量词)","e":"Entre o número/demonstrativo e o substantivo entra um classificador próprio de cada coisa: 一把椅子、一双鞋、一张桌子、一辆车、一公斤.","zh":"我买了一双新鞋。","py":"wǒ mǎi le yī shuāng xīn xié.","pt":"Comprei um par de sapatos novos.","aula":0},{"t":"Medidores emprestados (借用名量词): 碗、盘","e":"Objetos de cozinha servem de medida para o conteúdo: 一碗饭 (um prato/tigela de arroz), 两盘菜 (dois pratos de comida).","zh":"我们吃了两盘菜。","py":"wǒmen chī le liǎng pán cài.","pt":"Comemos dois pratos de comida.","aula":0},{"t":"Medidores de ação (动量词): 口、回、遍、声","e":"Contam a vez de um ato: 看一遍 (do começo ao fim), 说一声 (uma palavra), 吃一口 (uma mordida), 一回 (uma ocasião).","zh":"他把这句话读了两遍。","py":"tā bǎ zhè jù huà dú le liǎng biàn.","pt":"Ele leu essa frase duas vezes.","aula":0},{"t":"Reduplicação de medidores (量词重叠): 个个、张张","e":"Repetir o classificador sem 一 dá 'cada/todos os': 个个 = 'cada um/todos', 张张 = 'cada um (de papel/foto)'.","zh":"班里的同学个个都会说汉语。","py":"bān lǐ de tóngxué gè gè dōu huì shuō Hànyǔ.","pt":"Todos os colegas da turma falam chinês.","aula":0},{"t":"Advérbios de grau (程度副词): 比较、还、更、特别、挺、有些、越、极","e":"Medem a intensidade. Para comparar, 比 pede 更 ('mais'); 有些 atenua um lado negativo; 越...越... = 'quanto mais..., mais...'.","zh":"雨越下越大。","py":"yǔ yuè xià yuè dà.","pt":"A chuva cai cada vez mais forte.","aula":0},{"t":"Advérbios de escopo (范围副词): 就、一块儿、一共、只、到处、只是","e":"Limitam o alcance do fato: 只 = 'só/apenas', 一共 = 'no total', 到处 = 'em toda parte', 一块儿 = 'juntos'.","zh":"我们一块儿去看电影。","py":"wǒmen yíkuàir qù kān diànyǐng.","pt":"Vamos juntos assistir a um filme.","aula":0},{"t":"Advérbios de tempo (时间副词): 才、马上、先、一会儿、刚、刚刚、一直","e":"Situam o tempo da ação: 刚 = 'acabei de', 马上 = 'já/a qualquer momento', 一直 = 'o tempo todo', 先 = 'primeiro', 才 = 'só (demorou)'.","zh":"火车马上就要开了。","py":"huǒchē mǎshàng jiù yào kāi le.","pt":"O trem vai partir já já.","aula":0},{"t":"Advérbios de frequência (频率副词): 总、总是、又、常常","e":"Tratam da repetição: 常常 = 'com frequência', 总是 = 'sempre/toda vez', 又 = 'outra vez' (repetição que já aconteceu).","zh":"他常常自己去图书馆。","py":"tā chángcháng zìjǐ qù túshūguǎn.","pt":"Costuma ir sozinho à biblioteca.","aula":0},{"t":"Advérbio correlativo: 一边...一边...","e":"Une duas ações feitas ao mesmo tempo: 一边...一边... = 'enquanto..., ...' (fazer X e Y simultaneamente).","zh":"他喜欢一边吃饭一边看电视。","py":"tā xǐhuan yìbiān chī fàn yìbiān kàn diàn shì.","pt":"Ele gosta de comer assistindo à TV.","aula":0},{"t":"Advérbios de modalidade (情态副词): 大概、必须、差不多、一定、好像、几乎","e":"Dão a atitude do falante sobre o fato: 大概/差不多 = 'provavelmente/aproximadamente', 一定/必须 = 'certamente/tem de', 好像 = 'parece que', 几乎 = 'quase'.","zh":"他还没来,大概有事。","py":"tā huán méi lái , dàgài yǒu shì.","pt":"Ele ainda não veio, provavelmente tem algo a resolver.","aula":0},{"t":"Advérbios de tom (语气副词): 当然、其实、终于","e":"Dão o tom da fala: 当然 = 'claro/naturalmente', 其实 = 'na verdade', 终于 = 'por fim, depois de espera'.","zh":"等了两个小时,他终于到了。","py":"děng le liǎng gè xiǎoshí , tā zhōngyú dào le.","pt":"Depois de duas horas de espera, ele finalmente chegou.","aula":0},{"t":"Advérbios de negação (否定副词): 不必、不用","e":"Negam a necessidade ('não é preciso'): 不必 (mais formal), 不用 (coloquial). Não negam permissão nem capacidade.","zh":"路很近,你不必打车。","py":"lù hěn jìn , nǐ búbì dǎchē.","pt":"A rua é perto, você não precisa pegar táxi.","aula":0},{"t":"Preposição de objeto/direção: 为、向、关于","e":"为 = em prol de; 向 = a/para alguém (direção da fala); 关于 = 'sobre' um assunto.","zh":"关于这件事,我去问他。","py":"guānyú zhè jiàn shì , wǒ qù wèn tā.","pt":"Sobre esse assunto, vou perguntar a ele.","aula":0},{"t":"Preposição de fim/base: 为了、根据","e":"为了 introduz a finalidade ('a fim de'); 根据 indica a base ('com base em / conforme').","zh":"为了身体健康,他每天早上跑步。","py":"wèile shēn tǐ jiàn kāng , tā měi tiān zǎoshang pǎobù.","pt":"Para ter boa saúde, ele corre de manhã todo dia.","aula":0},{"t":"把 / 被 (traz o objeto / marca passiva)","e":"把 move o objeto definido para antes do verbo (ação sobre ele); 被 marca a passiva (sujeito sofre a ação).","zh":"我把书放在桌子上了。","py":"wǒ bǎ shū fàng zài zhuōzi shàng le.","pt":"Eu pus o livro sobre a mesa.","aula":0},{"t":"Conectivos simples: 或、或者、可是、然后","e":"或/或者 ligam alternativas ('ou'); 可是 = 'mas' (adversativo); 然后 marca sequência ('depois/em seguida').","zh":"你先吃饭,然后去看医生。","py":"nǐ xiān chī fàn , ránhòu qù kān yīshēng.","pt":"Você come primeiro, depois vai ao médico.","aula":0},{"t":"Partícula condicional 的话","e":"的话 vai no fim da oração de condição e equivale a 'se' (如果); é comum na fala.","zh":"你要去的话,就叫上我。","py":"nǐ yào qù dehuà , jiù jiào shàng wǒ.","pt":"Se você for, me chama.","aula":0},{"t":"Locuções aposto (同位短语)","e":"Dois nomes do mesmo tipo se encostam e se explicam: '北京,中国的首都' ou '我们班长小明'.","zh":"小王,我的朋友,人很好。","py":"xiǎo wáng , wǒ de péngyou , rén hěn hào.","pt":"Xiao Wang, meu amigo, é gente boa.","aula":0},{"t":"Frase verbo-complemento (动补短语)","e":"Verbo + complemento de resultado/grau: 听懂 / 走进来 / 说得很好. O complemento completa o sentido do verbo.","zh":"他说得太快了,你听明白了吗?","py":"tā shuō de tài kuài le , nǐ tīng míngbai le ma ?","pt":"Ele falou muito rápido; você entendeu?","aula":0},{"t":"Repetição de número+medidor (数量重叠)","e":"'número + medidor + número + medidor' dá ideia de alternância ou sequência: 一步一步 (um passo por vez), 一次一次 (uma vez após outra).","zh":"我们一个一个地说,别急。","py":"wǒmen yí gè yí gè dì shuō , bié jí.","pt":"Vamos falar um por um, sem afobação.","aula":0},{"t":"固定格式: 才 / 就 (语气副词 — limitar e sequência imediata)","e":"Aqui 才 não é tempo, é limite ('só / apenas'; 'tão pouco'): 才三天 = 'só três dias'. E 就 marca a consequência imediata, no par 一…就… ('assim que… já…').","zh":"才三天,他就想家了。","py":"cái sān tiān , tā jiù xiǎng jiā le.","pt":"Em só três dias, ele já sente saudade de casa.","aula":0},{"t":"固定短语: 看来 / 看起来 / 看上去 / 在……看来","e":"'Ao que parece': 看起来 / 看上去 = 'parece que'; 在 X 看来 = 'na opinião de X'.","zh":"在老师看来,这个办法不太好用。","py":"zài lǎoshī kànlái , zhège bànfǎ bù tài hǎo yòng.","pt":"Na opinião da professora, esse jeito não funciona bem.","aula":0},{"t":"固定短语: 越来越 / 不一会儿","e":"越来越 = 'cada vez mais' (X越来越Y); 不一会儿 = 'daqui a pouco / em um instante'.","zh":"天气越来越热了。","py":"tiānqì yuè lái yuè rè le.","pt":"O tempo está ficando cada vez mais quente.","aula":0},{"t":"固定格式: 除了……(以外),……还/也/都……","e":"'Além de X, (o resto) também/todos...' — 除了 marca o que fica fora ou se soma ao resto; 以外 (opcional) fecha o trecho.","zh":"除了汉语,他还学英语。","py":"chúle Hànyǔ , tā hái xué yīng yǔ.","pt":"Além de chinês, ele também estuda inglês.","aula":0},{"t":"固定格式: 对……来说 / 一般来说 / 不怎么样","e":"对X来说 = 'para X'; 一般来说 = 'em geral'; 不怎么样 = 'não é grande coisa'.","zh":"对我来说,这个问题不难。","py":"duì wǒ lái shuō , zhège wèntí bù nán.","pt":"Para mim, essa pergunta não é difícil.","aula":0},{"t":"固定格式: 一……也/都+不/没……","e":"'Nem um só': 一 + medidor + (substantivo) + 也/都 + 不/没 + verbo. Ênfase de zero absoluto.","zh":"他一个字也不认识。","py":"tā yí gè zì yě bù rènshi.","pt":"Ele não reconhece nem uma palavra.","aula":0},{"t":"固定格式: 从……起 / 从……开始","e":"从 X 起 = 'a partir de X' (marco temporal ou de lugar): 从今天起, 从这里起.","zh":"从今天起,我每天跑步。","py":"cóng jīn tiān qǐ , wǒ měi tiān pǎobù.","pt":"A partir de hoje, corro todo dia.","aula":0},{"t":"固定格式: (在)……以前 / 以后 / 前 / 后","e":"'antes de / depois de' um evento. 在 é opcional: (在)吃饭以前 = antes de comer. O advérbio de tempo vem antes da oração principal.","zh":"吃饭以前,先洗手。","py":"chī fàn yǐqián , xiān xǐ shǒu.","pt":"Antes de comer, lave as mãos primeiro.","aula":0},{"t":"固定格式: X什么(的) (listas vagas)","e":"Depois de exemplos, 什么(的) amacia e engloba: 'mesa, cadeira e essas coisas'. O 的 é opcional; com 啊, reforça a enumeração.","zh":"我买了桌子、椅子什么的。","py":"wǒ mǎi le zhuōzi, yǐzi shénme de.","pt":"Comprei mesa, cadeira e essas coisas.","aula":0},{"t":"固定格式: 该……了 (hora de)","e":"该 X 了 = 'chegou a hora de X' / 'já devia X'. Indica que o momento chegou.","zh":"快八点了,该上课了。","py":"kuài bā diǎn le , gāi shàngkè le.","pt":"São quase oito, está na hora da aula.","aula":0},{"t":"固定格式: 在……上 / 下 / 中","e":"'no aspecto / na condição de': 在……上 (no que toca a), 在……下 (sob), 在……中 (no meio de). Ex.: 在这些问题上.","zh":"在这件事上,他说得对。","py":"zài zhè jiàn shì shàng , tā shuō de duì.","pt":"Nesse assunto, ele está certo.","aula":0},{"t":"Verbo ou adjetivo como sujeito (动词/形容词作主语)","e":"Uma atividade (verbo) ou qualidade (adjetivo) pode ser o assunto da frase, sem virar substantivo: 学习很重要 / 坐着不好.","zh":"运动对身体好。","py":"yùndòng duì shēntǐ hào.","pt":"Exercício faz bem ao corpo.","aula":0},{"t":"Frase sujeito-predicado como sujeito (主谓短语作主语)","e":"Uma oração inteira funciona como sujeito: '你来, 我很高兴' — 'o fato de você vir' me deixa feliz.","zh":"你来我很高兴。","py":"nǐ lái wǒ hěn gāoxìng.","pt":"Sua vinda me deixa feliz.","aula":0},{"t":"Ordem de vários determinantes (多项定语)","e":"Antes do substantivo, a ordem é: [posse] → [demonstrativo+num+medidor] → [descritivo] → [categoria]. Ex.: 我姐姐的那本新汉语书.","zh":"那是我姐姐的新书。","py":"nà shì wǒ jiějie de xīn shū.","pt":"É o livro novo da minha irmã mais velha.","aula":0},{"t":"Complemento de resultado (结果补语): 到、住、走、上","e":"Após o verbo, o resultado fecha o sentido: 找到 (achou), 记住 (fixou na memória), 拿走 (levou), 穿上/关上 (vestiu/fechou).","zh":"我在桌子上找到了我的手机。","py":"wǒ zài zhuōzi shàng zhǎo dào le wǒ de shǒujī.","pt":"Achei meu celular em cima da mesa.","aula":0},{"t":"Complemento de direção figurado — resultado (出、起、下)","e":"V+出 (perceber/descobrir), V+起 (surgir/iniciar estado), V+下 (fixar/assentar). Ex.: 想出来, 笑起来, 记下.","zh":"这个问题我想出来了。","py":"zhège wèntí wǒ xiǎng chūlái le.","pt":"Já descobri a resposta dessa pergunta.","aula":0},{"t":"Complemento de direção — início da ação (上、起来)","e":"V+起来 (começar a) e V+上 (envolver-se em). Ex.: 下起雨来, 爱上.","zh":"天气说变就变,下起雨来了。","py":"tiānqì shuō biàn jiù biàn , xià qǐ yǔ lái le.","pt":"O tempo muda num instante; começou a chover.","aula":0},{"t":"Complemento de direção — continuação (下去、下来)","e":"V+下去 (continuar para a frente), V+下来 (manter o estado até agora). Ex.: 说下去 (continue falando), 坚持下去 (insistir).","zh":"请你把故事说下去。","py":"qǐng nǐ bǎ gùshi shuō xiàqù.","pt":"Por favor, continue contando a história.","aula":0},{"t":"Complemento de possibilidade (可能补语): V+得/不+C","e":"Potencial: V+得+C = consegue o resultado; V+不+C = não consegue. Ex.: 看得见/看不见, 记得住/记不住, 来得及/来不及.","zh":"离得太远,我看不见。","py":"lí de tài yuǎn , wǒ kàn bú jiàn.","pt":"Está longe demais; não consigo ver.","aula":0},{"t":"Complemento de grau (程度补语): 得很、极了、坏了","e":"Adjetivo + 得很 / 极了 / 坏了 reforçam intensidade (好得很, 漂亮极了, 急坏了).","zh":"这个办法好得很。","py":"zhège bànfǎ hào de hěn.","pt":"Essa ideia é boa demais.","aula":0},{"t":"Complemento de tempo decorrido (数量补语3)","e":"Verbo + duração marca o tempo desde o fim do ato: 走了三天 (partiu há três dias), 到这儿两年了 (chegou há dois anos).","zh":"他到这儿三天了。","py":"tā dào zhèr sān tiān le.","pt":"Ele chegou aqui há três dias.","aula":0},{"t":"Pergunta com 怎样+verbo (怎样+动词的特指问)","e":"怎样 + verbo = 'como fazer tal coisa' (modo). '这件事怎样办?' = como resolver isso.","zh":"这个问题怎样解决?","py":"zhège wèntí zěnyàng jiějué ?","pt":"Como resolver essa questão?","aula":0},{"t":"Pergunta retórica 不是……吗 (反问句)","e":"'不是……吗?' reforça algo que já se sabe, esperando concordância: '你不是学生吗?' (você é estudante, não é?).","zh":"你不是说他今天来吗?","py":"nǐ bú shì shuō tā jīntiān lái ma ?","pt":"Você não disse que ele vinha hoje?","aula":0},{"t":"把字句 (1): S+把+O+V+在/到+lugar","e":"O verbo de colocação leva 在/到+lugar após ele. Nunca basta só o verbo: 把书放在桌子上.","zh":"我把书放在桌子上了。","py":"wǒ bǎ shū fàng zài zhuōzi shàng le.","pt":"Pus o livro sobre a mesa.","aula":0},{"t":"把字句 (2): S+把+O1+V(给)+O2","e":"Transferência com 把: 我把钱给了他 (dei o dinheiro a ele). 给 marca o receptor.","zh":"我把作业给了老师。","py":"wǒ bǎ zuòyè gěi le lǎoshī.","pt":"Dei a tarefa à professora.","aula":0},{"t":"把字句 (3): S+把+O+V+complemento (resultado/direção/estado)","e":"Depois de 把+objeto+verbo vem um complemento (resultado, direção ou estado). Sozinho, o verbo não serve: 把作业做完了.","zh":"他把门打开了。","py":"tā bǎ mén dǎkāi le.","pt":"Ele abriu a porta.","aula":0},{"t":"被字句: S+被+(agente)+V+outros (passiva)","e":"Sujeito sofre a ação. 被 + agente + verbo + complemento; o verbo não fica 'seco'. 被/让/叫 dão passiva.","zh":"我的钱包被人拿走了。","py":"wǒ de qián bāo bèi rén ná zǒu le.","pt":"Levaram minha carteira (minha carteira foi roubada).","aula":0},{"t":"被字句 sem agente: S+被+V+outros","e":"Quando o agente não importa, ele some: 门被打开了 (a porta foi aberta). Fica 被+verbo+complemento.","zh":"门被打开了。","py":"mén bèi dǎkāi le.","pt":"A porta foi aberta.","aula":0},{"t":"连动句: V1+着+V2 (ação secundária em andamento)","e":"O primeiro verbo com 着 descreve a circunstância enquanto o segundo é o foco: 站着说话 (falar em pé), 开着电视学习 (estudar com a TV ligada).","zh":"他站着说话了半天。","py":"tā zhàn zhe shuōhuà le bàntiān.","pt":"Ele ficou de pé falando um bom tempo.","aula":0},{"t":"比较句: A比B+更/还+adjetivo","e":"Ao comparar, 比 marca A>B. Para 'ainda mais', use 更 ou 还 depois de 比, antes do adjetivo.","zh":"今年比去年更热。","py":"jīnnián bǐ qùnián gèng rè.","pt":"Este ano está mais quente que o ano passado.","aula":0},{"t":"比较句: A跟B一样(+adjetivo)","e":"跟 introduz o termo de comparação e 一样 diz que são iguais; o adjetivo pode vir depois: 跟我一样高.","zh":"他跟我一样高。","py":"tā gēn wǒ yíyàng gāo.","pt":"Ele é tão alto quanto eu.","aula":0},{"t":"比较句: A不比B+adjetivo (não supera)","e":"不比 = 'não é mais...que', negando a vantagem de A sobre B.","zh":"他考试不比你好。","py":"tā kǎoshì bù bǐ nǐ hǎo.","pt":"Na prova ele não é melhor que você.","aula":0},{"t":"比较句: A比B+多/少/早/晚+verbo+quantidade","e":"Diferença em grau na ação: 我比他早来两天. 多/少/早/晚 vem antes do verbo e a quantidade depois.","zh":"我比他早到了两天。","py":"wǒ bǐ tā zǎo dào le liǎng tiān.","pt":"Cheguei dois dias antes que ele.","aula":0},{"t":"存现句: lugar+V+complemento+(了)+quantidade+ser/coisa (aparecer)","e":"Frase que abre com lugar + verbo + resultado + 了 + item. Marca algo que surge: 门口站着一些学生 / 桌子上放了一本书.","zh":"门口站着一些学生。","py":"ménkǒu zhàn zhe yìxiē xuéshēng.","pt":"Há alguns estudantes de pé na porta.","aula":0},{"t":"存现句 — desaparecimento","e":"Lugar+verbo+resultado+了+perda: 走了一个同学 (foi embora um colega).","zh":"我们班走了一个同学。","py":"wǒmen bān zǒu le yí gè tóngxué.","pt":"Um colega saiu da nossa turma.","aula":0},{"t":"是……的: ênfase em opinião/atitude do falante","e":"Além de ênfase em modo/tempo, a moldura 是…的 reforça avaliação: 我是喜欢这个决定的 (gostar é que eu gosto).","zh":"我是喜欢这个决定的。","py":"wǒ shì xǐhuan zhège juédìng de.","pt":"Eu gosto dessa decisão (é fato que gosto).","aula":0},{"t":"承接复句: 先……, 再/然后……","e":"Sequência: primeiro X, depois Y. 先 no primeiro membro, 再 ou 然后 no segundo.","zh":"先洗手,再吃饭。","py":"xiān xǐ shǒu , zài chī fàn.","pt":"Primeiro lave as mãos, depois coma.","aula":0},{"t":"选择复句: 或者……,或者…… (ou... ou...)","e":"Duas opções alternativas. Não use 或/或者 dentro de uma única pergunta (para pergunta use 还是).","zh":"或者你去,或者我去。","py":"huòzhě nǐ qù , huòzhě wǒ qù.","pt":"Ou você vai, ou eu vou.","aula":0},{"t":"选择复句: 一会儿……,一会儿…… (ora... ora...)","e":"Alternância ao longo do tempo: 一会儿哭,一会儿笑.","zh":"小猫一会儿跳,一会儿跑。","py":"xiǎo māo yíhuìr tiào , yíhuìr pǎo.","pt":"O gatinho ora pula, ora corre.","aula":0},{"t":"并列复句: 又……,又…… (e... e...)","e":"Duas qualidades/ações simultâneas: 又唱又跳, 又大又便宜.","zh":"她又聪明又努力。","py":"tā yòu cōngmíng yòu nǔlì.","pt":"Ela é esperta e aplicada.","aula":0},{"t":"并列复句: 一边……,一边…… (ao mesmo tempo — ver 3-01)","e":"Duas ações simultâneas (já visto como 关联副词 no 3-01). Exemplo em outro contexto.","zh":"他一边吃饭一边看手机。","py":"tā yìbiān chī fàn yìbiān kān shǒujī.","pt":"Ele come mexendo no celular.","aula":0},{"t":"递进复句: 不但……,而且…… (não só... como também...)","e":"Progressão: X e, além disso, Y. Se os sujeitos forem iguais, 不但 vem DEPOIS do sujeito; se diferentes, ANTES.","zh":"他不但不聪明,而且不努力。","py":"tā búdàn bù cōngmíng , érqiě bù nǔlì.","pt":"Além de não ser esperto, ele não se aplica.","aula":0},{"t":"转折复句: 虽然……,可是/但是…… (embora... , mas...)","e":"Concessão: 虽然 X, 可是/但是 Y. Não combine 虽然 com 因为/所以.","zh":"虽然有点贵,但是我很喜欢。","py":"suīrán yǒu diǎn guì , dànshì wǒ hěn xǐhuan.","pt":"Embora um pouco caro, eu gosto muito dele.","aula":0},{"t":"假设复句: 如果……,就…… (se..., então...)","e":"Condição hipotética: 如果 X, (就) Y.","zh":"如果明天不下雨,我们就去爬山。","py":"rúguǒ míngtiān bù xià yǔ , wǒmen jiù qù pá shān.","pt":"Se amanhã não chover, vamos subir a montanha.","aula":0},{"t":"条件复句: 只有……,才…… (só se...)","e":"Condição necessária: 只有 X, 才 Y — sem X, não Y.","zh":"只有多听,才会懂。","py":"zhǐyǒu duō tīng , cái huì dǒng.","pt":"Só ouvindo bastante é que se entende.","aula":0},{"t":"条件复句: 只要……,就…… (basta que...)","e":"Condição suficiente: 只要 X, 就 Y — com X, basta.","zh":"只要努力,就会学好。","py":"zhǐyào nǔlì , jiù huì xué hǎo.","pt":"Basta esforçar-se para aprender bem.","aula":0},{"t":"目的复句: 为了……,…… (a fim de X, Y)","e":"为了 abre a oração de propósito e o segundo membro traz a ação tomada por esse fim. É 复句 (duas orações), não só 为了+substantivo.","zh":"为了考上大学,他每天都复习。","py":"wèile kǎo shàng dàxué , tā měi tiān dōu fùxí.","pt":"Para entrar na universidade, ele revisa todos os dias.","aula":0},{"t":"紧缩复句: ……了……(就)…… (assim que / ao fazer)","e":"Duas ações coladas sem pausa: 一看就懂 (basta ver para entender), 下了课就去吃饭 (terminada a aula, vou comer). O 就 é opcional.","zh":"他一学就会。","py":"tā yī xué jiù huì.","pt":"Ele aprende à primeira.","aula":0},{"t":"特殊表达法: 概数 com 大概 (aproximadamente)","e":"大概 anteposto ao número/quantidade indica valor aproximado: 大概三个 ('mais ou menos três'), 大概下午三点.","zh":"大概有十个学生来了。","py":"dàgài yǒu shí gè xuéshēng lái le.","pt":"Vieram mais ou menos dez estudantes.","aula":0},{"t":"特殊表达法: 相邻数词连用 (ex.: 三四 / 五六)","e":"Dois numerais vizinhos colados dão um valor aproximado: 三四个人 (três ou quatro pessoas), 五六本.","zh":"桌子上有三四个苹果。","py":"zhuōzi shàng yǒu sān sì gè píngguǒ.","pt":"Há três ou quatro maçãs sobre a mesa.","aula":0}],"4":[],"5":[],"6":[]},"gItems":[{"id":"g1x00","lv":1,"s":"我___学生。","o":["是","有","在","叫"],"a":"是","ex":"Identidade: 是.","full":"我是学生。","py":"wǒ shì xuéshēng."},{"id":"g1x01","lv":1,"s":"我___有哥哥。","o":["没","不","别","也"],"a":"没","ex":"A negação de 有 é sempre 没有.","full":"我 /* Wikawise (herdado do DevWise/IAWise) - modelos de rastreamento do conhecimento.

   Um modelo PILOTA o jogo (calcula o domínio exibido, libera fases, escolhe a dificuldade do próximo ticket). Os demais rodam como
   SOMBRAS: antes de cada resposta registram no log a probabilidade de acerto que previam, e atualizam o próprio estado, sem interferir.
   A seleção segue as ferramentas do estudo de confundidores com o ENEM que podem rodar no navegador sem treino prévio:
     elo  Elo/Rasch online com dificuldade de item e chute (estrutura do lado do item; piloto padrão)
     irt  TRI de 3 parâmetros com habilidade por EAP numa grade de 81 pontos, só com as respostas anteriores (o "teto" psicométrico)
     bkt  Bayesian Knowledge Tracing (Corbett e Anderson)
     pfa  Performance Factors Analysis (sucessos e falhas anteriores)
     afm  Additive Factor Model (contagem de oportunidades)
   As arquiteturas profundas do estudo (DKT, DKVMN, SAKT, AKT, SAINT, SimpleKT) exigem treino em muitos alunos: o log exportado tem o
   formato necessário para treiná-las fora do jogo.

   TODOS os parâmetros abaixo são a priori de projeto, não estimativas. A recomendação do próprio estudo vale aqui: recalibrar os itens
   na população real, a partir dos logs exportados, e republicar as dificuldades em ITEM_B. */
const KT = (() => {
  const sig = x => 1 / (1 + Math.exp(-x)), logit = p => Math.log(p / (1 - p)), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const B_SCALE = 1.2;                                   // dificuldade autoral 1, 2, 3 vira b = -1,2, 0, +1,2 logits
  const ITEM_B = {};                                     // recalibração empírica por item (id -> b), quando houver dados
  const itemB = it => ITEM_B[it.id] != null ? ITEM_B[it.id] : (it.d - 2) * B_SCALE;
  const GRID = Array.from({ length: 81 }, (_, i) => -4 + i * 0.1);

  const MODELS = {
    /* K0 e DEC calibrados por simulação (iniciante domina uma habilidade em ~10 tickets). WRONG < 1 amortece a queda após um erro isolado
       (tolerância a deslize, como o 'slip' do BKT): sem isso um único erro num item fácil apagava dois acertos. Custo assumido: leve viés para cima. */
    elo: { master: 0.85, K0: 1.8, DEC: 0.06, WRONG: 0.7,
      init: L => ({ th: logit(clamp(L, .02, .98)), n: 0 }),
      predict: (m, it, c) => c + (1 - c) * sig(m.th - itemB(it)),
      update(m, it, c, y) { const p = this.predict(m, it, c); m.th = clamp(m.th + this.K0 / (1 + this.DEC * m.n) * (y - p) * (y ? 1 : this.WRONG), -4, 5); m.n++; },
      mastery: m => sig(m.th) },
    irt: { master: 0.85, shadowOnly: true,   // referência psicométrica ESTÁTICA (o "teto" do estudo): não acompanha quem está aprendendo, então nunca pilota
      init: L => ({ mu: logit(clamp(L, .02, .98)), r: [] }),
      post(m) { let w = GRID.map(t => Math.exp(-0.5 * Math.pow((t - m.mu) / 1.2, 2))); for (const [b, c, y] of m.r) w = w.map((x, i) => { const p = c + (1 - c) * sig(GRID[i] - b); return x * (y ? p : 1 - p); }); const s = w.reduce((a, b) => a + b, 0) || 1; return w.map(x => x / s); },
      predict(m, it, c) { const w = this.post(m), b = itemB(it); return w.reduce((a, x, i) => a + x * (c + (1 - c) * sig(GRID[i] - b)), 0); },
      update(m, it, c, y) { m.r.push([+itemB(it).toFixed(2), +c.toFixed(3), y ? 1 : 0]); if (m.r.length > 60) m.r.shift(); },
      mastery(m) { const w = this.post(m); return sig(w.reduce((a, x, i) => a + x * GRID[i], 0)); } },
    bkt: { master: 0.95, T: 0.2, SLIP: 0.1,
      init: L => ({ L }),
      predict(m, it, c) { return m.L * (1 - this.SLIP) + (1 - m.L) * c; },
      update(m, it, c, y) { const s = this.SLIP, L = m.L, post = y ? L * (1 - s) / (L * (1 - s) + (1 - L) * c) : L * s / (L * s + (1 - L) * (1 - c)); m.L = Math.min(.995, post + (1 - post) * this.T); },
      mastery: m => m.L },
    pfa: { master: 0.85, BETA: -1.4, GAMMA: 0.75, RHO: -0.15,
      init: L => ({ s: 0, f: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.s + this.RHO * m.f; },
      predict(m) { return sig(this.lin(m)); },
      update(m, it, c, y) { if (y) m.s++; else m.f++; },
      mastery(m) { return sig(this.lin(m)); } },
    afm: { master: 0.85, BETA: -1.4, GAMMA: 0.45,
      init: L => ({ n: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.n; },
      predict(m) { return sig(this.lin(m)); },
      update(m) { m.n++; },
      mastery(m) { return sig(this.lin(m)); } }
  };
  const IDS = Object.keys(MODELS);
  return {
    IDS, MODELS, itemB, PILOTS: IDS.filter(k => !MODELS[k].shadowOnly),
    ensure(tr) { if (!tr.m) tr.m = {}; for (const k of IDS) if (!tr.m[k]) tr.m[k] = MODELS[k].init(tr.L); return tr; },
    predictAll(tr, it, c) { this.ensure(tr); const o = {}; for (const k of IDS) o[k] = +clamp(MODELS[k].predict(tr.m[k], it, c), .001, .999).toFixed(4); return o; },
    updateAll(tr, it, c, y) { this.ensure(tr); for (const k of IDS) MODELS[k].update(tr.m[k], it, c, y); },
    mastery(tr, pilot) { this.ensure(tr); return clamp(MODELS[pilot].mastery(tr.m[pilot]), .001, .999); },
    master: pilot => MODELS[pilot].master,
    /* métricas de previsão sobre um log: Brier, AUC (Mann-Whitney) e acurácia a 0,5 */
    score(log, k) { const rows = log.filter(l => l.preds && l.preds[k] != null); if (!rows.length) return null;
      const brier = rows.reduce((a, l) => a + Math.pow(l.preds[k] - (l.ok ? 1 : 0), 2), 0) / rows.length, acc = rows.filter(l => (l.preds[k] >= .5) === !!l.ok).length / rows.length;
      const pos = rows.filter(l => l.ok).map(l => l.preds[k]), neg = rows.filter(l => !l.ok).map(l => l.preds[k]); let auc = null;
      if (pos.length && neg.length) { let w = 0; for (const a of pos) for (const b of neg) w += a > b ? 1 : a === b ? .5 : 0; auc = w / (pos.length * neg.length); }
      return { n: rows.length, brier, auc, acc }; }
  };
})();

/* Wikawise - camada de jogo: economia de XP, modos de dificuldade, loja e patentes. Mesma economia do DevWise/IAWise. */

/* Modos. mult: multiplicador de XP; pen: XP perdido por erro (x dificuldade do item); hint: lente liberada? */
const MODES = {
  normal:   { mult: 1,   pen: 2,  hint: true },
  medio:    { mult: 1.5, pen: 4,  hint: true },
  dificil:  { mult: 2,   pen: 6,  hint: false },
  hardcore: { mult: 3,   pen: 10, hint: false }
};
const MODE_ICON = { normal: "🌱", medio: "⚙️", dificil: "🔥", hardcore: "💀" };
const ITEM_XP = { 1: 10, 2: 20, 3: 35 };   // XP base por dificuldade do item
const COMEBACK = 5;                       // bônus por acertar logo depois de um erro

/* Loja. kind: "power" (consumível) | "title" (cosmético, compra única). */
const SHOP = [
  { id: "shield", icon: "🛡️", kind: "power", cost: 30 },
  { id: "boost",  icon: "⚡", kind: "power", cost: 40 },
  { id: "lens",   icon: "🔍", kind: "power", cost: 20 },
  { id: "key",    icon: "🗝️", kind: "power", cost: 60 },
  { id: "tXue",   icon: "学", kind: "title", cost: 80 },
  { id: "tYou",   icon: "友", kind: "title", cost: 150 },
  { id: "tLong",  icon: "龙", kind: "title", cost: 300 }
];

/* Patentes por XP acumulado. */
const ROLE_XP = [0, 150, 400, 900, 1600, 2600];

const GAME = {
  gain(S, d, ok) {
    const M = MODES[S.mode] || MODES.normal;
    if (ok) {
      let x = Math.round(ITEM_XP[d] * M.mult);
      if (S.boost > 0) { x *= 2; S.boost--; }
      if (S.lastWrong) x += COMEBACK;
      return x;
    }
    if (S.inv.shield > 0) { S.inv.shield--; return 0; }
    return -M.pen * d;
  },
  role(xpTotal) { let r = 0; ROLE_XP.forEach((v, i) => { if (xpTotal >= v) r = i; }); return r; }
};

/* Wikawise - motor sem DOM: gera itens a partir do vocabulário oficial, escolhe o próximo item, decide desbloqueios e priors.
   Os itens seguem os princípios do HSK 3.0: quatro dimensões (音节 sílabas, 汉字 caracteres, 词汇 vocabulário, 语法 gramática)
   e cinco habilidades (听 ouvir, 说 falar, 读 ler, 写 escrever, 译 traduzir). Cada item carrega a dimensão/habilidade em `dim`. */
const ENGINE = (() => {
  const WORD = {}; DATA.words.forEach(w => { if (!WORD[w.z]) WORD[w.z] = w; });
  const UNITS = {}; DATA.levels.forEach(L => L.units.forEach(u => { UNITS[u.id] = u; }));
  const WRITE_UPTO = {}; let acc = new Set();
  for (let lv = 1; lv <= 6; lv++) { (DATA.writing[lv] || []).forEach(c => acc.add(c)); WRITE_UPTO[lv] = new Set(acc); }
  const DIMS = ["listen", "speak", "read", "write", "translate", "syllable", "grammar"];
  const UNLOCK = 0.6, L0 = 0.15;

  /* aleatório com semente (as opções de um item ficam estáveis enquanto ele está na tela) */
  function rng(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const shuffle = (a, r = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gloss = (w, lang) => (lang === "en" ? (w.en || w.pt) : (w.pt || w.en)) || "—";
  const glossIsFallback = (w, lang) => lang === "en" ? !w.en : !w.pt;

  /* variações de tom do pinyin para distratores do item de sílabas */
  const TONES = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
  const BASE = {}; for (const v in TONES) [...TONES[v]].forEach((t, k) => { BASE[t] = [v, k]; });
  function pinyinVariants(py, n, r = Math.random) {
    const out = new Set([py]), chars = [...py];
    const toned = chars.map((c, i) => BASE[c] ? i : -1).filter(i => i >= 0);
    const vowels = chars.map((c, i) => TONES[c] ? i : -1).filter(i => i >= 0);
    let guard = 0;
    while (out.size < n + 1 && guard++ < 60) {
      const cs = chars.slice();
      if (toned.length && r() < .85) {
        const i = toned[Math.floor(r() * toned.length)], [v, k] = BASE[cs[i]];
        let k2 = Math.floor(r() * 4); if (k2 === k) k2 = (k2 + 1 + Math.floor(r() * 3)) % 4;
        cs[i] = TONES[v][k2];
        if (toned.length > 1 && r() < .4) { const j = toned[Math.floor(r() * toned.length)]; if (j !== i) { const [v2, kk] = BASE[cs[j]]; cs[j] = TONES[v2][(kk + 1 + Math.floor(r() * 3)) % 4]; } }
      } else if (vowels.length) {
        const i = vowels[Math.floor(r() * vowels.length)]; cs[i] = TONES[cs[i]][Math.floor(r() * 4)];
      }
      out.add(cs.join(""));
    }
    out.delete(py);
    return [...out].slice(0, n);
  }

  /* distratores de vocabulário: mesma unidade primeiro, depois o mesmo nível; glosas diferentes da correta */
  function distractors(w, n, lang, r) {
    const pool = shuffle(DATA.words.filter(x => x.lv === w.lv && x.z !== w.z), r);
    const g = gloss(w, lang), seen = new Set([g]), out = [];
    for (const x of pool) { const gx = gloss(x, lang); if (!seen.has(gx) && x.z.length <= w.z.length + 2) { seen.add(gx); out.push(x); } if (out.length >= n) break; }
    return out;
  }
  function charDistractors(ch, lv, n, r) {
    const pool = shuffle([...WRITE_UPTO[Math.max(2, lv)]].filter(c => c !== ch), r);
    return pool.slice(0, n);
  }

  /* itens de uma unidade de vocabulário */
  function unitItems(uid, caps) {
    const u = UNITS[uid]; if (!u) return [];
    const items = [];
    u.w.forEach(z => {
      const w = WORD[z], base = { skill: uid, lv: u.lv, w: z };
      items.push({ ...base, id: `${uid}:${z}:r`, type: "read", dim: "read", d: 1, c: .25 });
      items.push({ ...base, id: `${uid}:${z}:p`, type: "pinyin", dim: "syllable", d: 2, c: .25 });
      items.push({ ...base, id: `${uid}:${z}:t`, type: "translate", dim: "translate", d: 2, c: .25 });
      if (caps.voice) items.push({ ...base, id: `${uid}:${z}:l`, type: "listen", dim: "listen", d: 2, c: .25 });
      if (caps.mic) items.push({ ...base, id: `${uid}:${z}:s`, type: "speak", dim: "speak", d: 2, c: .1 });
      /* escrita à mão: HSK 3.0 só exige a partir do nível 2, e apenas os caracteres do programa de escrita até o nível */
      if (u.lv >= 2) { const ch = [...z].find(c => WRITE_UPTO[u.lv].has(c)); if (ch) items.push({ ...base, id: `${uid}:${z}:w:${ch}`, type: "write", dim: "write", d: 3, c: caps.writer ? .1 : .25, ch }); }
    });
    return items;
  }
  function grammarItems(lv) {
    const skill = "g" + lv, out = [];
    DATA.gItems.filter(g => g.lv === lv).forEach(g => out.push({ id: `${skill}:${g.id}`, skill, lv, type: "gap", dim: "grammar", d: 2, c: .25, g }));
    DATA.gSent.filter(s => s.lv === lv).forEach(s => out.push({ id: `${skill}:${s.id}`, skill, lv, type: "order", dim: "grammar", d: 3, c: .05, s }));
    return out;
  }
  const COURSE_LV = n => n >= 9 ? 2 : 1;
  /* palavra de um item: do vocabulário oficial ou, no curso, uma entrada própria (músicas, ditados, caracteres das pautas) */
  const wordOf = it => it.wobj || WORD[it.w];
  const pseudo = (zh, py, pt, lv) => WORD[zh] ? { ...WORD[zh], pt: WORD[zh].pt || pt } : { z: zh, p: py, pt, en: "", c: [], lv };
  function courseItems(n) {
    const skill = "c" + String(n).padStart(2, "0"), C = DATA.course, lv = COURSE_LV(n), out = [], seen = new Set();
    C.gaps.forEach((g, i) => { if (g.a === n) out.push({ id: `${skill}:gap${i}`, skill, lv, type: "gap", dim: "grammar", d: 2, c: .25, g: { s: g.s, o: g.o, a: g.ans, ex: g.ex, full: g.full, py: g.py } }); });
    C.sent.forEach((s, i) => { if (s.a === n) out.push({ id: `${skill}:ord${i}`, skill, lv, type: "order", dim: "translate", d: 3, c: .05, s: { zh: s.zh, pt: s.pt, t: s.toks, py: s.py, alt: s.alt } }); });
    C.read.forEach((r, ri) => { if (r.a === n) r.q.forEach((q, qi) => out.push({ id: `${skill}:rd${ri}.${qi}`, skill, lv, type: "rq", dim: "read", d: 2, c: .25, q, r: ri })); });
    C.vocab.filter(v => v.a === n).forEach(v => { if (seen.has(v.zh)) return; seen.add(v.zh); const wobj = pseudo(v.zh, v.py, v.pt, lv); out.push({ id: `${skill}:${v.zh}:r`, skill, lv, type: "read", dim: "read", d: 1, c: .25, w: v.zh, wobj }); });
    ((C.write || {})[n] || []).forEach(({ ch, py }) => { const wobj = WORD[ch] || { z: ch, p: py, pt: (C.vocab.find(v => v.zh === ch) || {}).pt || "", en: "", c: [], lv }; out.push({ id: `${skill}:w:${ch}`, skill, lv, type: "write", dim: "write", d: 3, c: .1, w: ch, wobj, ch }); });
    return out;
  }
  function itemsFor(skill, caps) {
    if (skill[0] === "h") return unitItems(skill, caps);
    if (skill[0] === "g") return grammarItems(+skill.slice(1));
    return courseItems(+skill.slice(1));
  }

  /* opções de múltipla escolha, estáveis por item + tentativa */
  function options(it, lang, seed) {
    const r = rng(it.id + "|" + seed), w = wordOf(it);
    if (it.type === "read") { const ds = distractors(w, 3, lang, r); return shuffle([w, ...ds], r).map(x => ({ key: x.z, label: gloss(x, lang) })); }
    if (it.type === "translate" || it.type === "listen") { const ds = distractors(w, 3, lang, r); return shuffle([w, ...ds], r).map(x => ({ key: x.z, label: x.z, py: x.p })); }
    if (it.type === "pinyin") {
      const v = pinyinVariants(w.p, 3, r);
      for (const x of shuffle(DATA.words.filter(x => x.lv === w.lv && x.z.length === w.z.length), r)) { if (v.length >= 3) break; if (x.p !== w.p && !v.includes(x.p)) v.push(x.p); }
      return shuffle([w.p, ...v], r).map(p => ({ key: p, label: p }));
    }
    if (it.type === "write") { return shuffle([it.ch, ...charDistractors(it.ch, it.lv, 3, r)], r).map(c => ({ key: c, label: c })); }
    if (it.type === "gap") return shuffle(it.g.o, r).map(o => ({ key: o, label: o }));
    if (it.type === "rq") return shuffle(it.q.o, r).map(o => ({ key: o, label: o, py: it.q.py[o] }));
    return [];
  }
  function answerKey(it) {
    if (it.type === "pinyin") return wordOf(it).p;
    if (it.type === "write") return it.ch;
